services:
  postgis:
    build:
      context: .
      dockerfile: docker/postgis/Dockerfile
 
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
 
    ports:
      - "${POSTGRES_PORT}:5432"
 
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data:ro
 
    restart: unless-stopped
 
volumes:
  pgdata:
    name: remote-db-${COMPOSE_PROJECT_NAME}-pgdata
 
.github/workflows/start_services.yml
name: Start Remote Database
 
on:
  push:
    branches:
      - env-test
      - env-qa
      - main
 
jobs:
  start-db:
    runs-on: self-hosted
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set environment variables
        run: |
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
 
          if [ "${{ github.ref_name }}" = "env-test" ]; then
            echo "POSTGRES_PORT=5444" >> .env
          elif [ "${{ github.ref_name }}" = "env-qa" ]; then
            echo "POSTGRES_PORT=5445" >> .env
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "POSTGRES_PORT=5446" >> .env
          fi
 
          echo "COMPOSE_PROJECT_NAME=${{ github.ref_name }}" >> .env
 
      - name: Start PostGIS
        run: |
          docker compose \
            -p remote-db-${{ github.ref_name }} \
            up -d --build
 
      - name: Show running containers
        run: docker ps
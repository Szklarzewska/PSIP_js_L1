
name: Start Remote Database

on:
  push:
    branches:
      - env-test
      - env-qa
      - main

permissions:
  contents: read

jobs:
  start-db:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment variables
        shell: bash
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          case "$BRANCH_NAME" in
            env-test) POSTGRES_PORT=5444 ;;
            env-qa) POSTGRES_PORT=5445 ;;
            main) POSTGRES_PORT=5446 ;;
            *) exit 1 ;;
          esac

          echo "POSTGRES_PORT=$POSTGRES_PORT" >> "$GITHUB_ENV"

          {
            echo "POSTGRES_USER=$POSTGRES_USER"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "POSTGRES_DB=$POSTGRES_DB"
          } >> "$GITHUB_ENV"

      - name: Validate Docker Compose
        run: docker compose -f docker-compose-remote.yml config --quiet

      - name: Start PostGIS
        run: |
          docker compose \
            -f docker-compose-remote.yml \
            -p remote-db-${{ github.ref_name }} \
            up -d --build

      - name: Show running containers
        run: |
          docker ps
          docker volume 

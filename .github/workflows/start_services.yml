name: Start Remote Database

on:
  push:
    branches:
      - env-test
      - env-qa
      - main

jobs:
  start-db:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env

          if [ "${{ github.ref_name }}" = "env-test" ]; then
            echo "POSTGRES_PORT=5444" >> .env
          elif [ "${{ github.ref_name }}" = "env-qa" ]; then
            echo "POSTGRES_PORT=5445" >> .env
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "POSTGRES_PORT=5446" >> .env
          fi

          echo "COMPOSE_PROJECT_NAME=${{ github.ref_name }}" >> .env

      - name: Debug compose file
        run: |
          pwd
          ls -la
          echo "===== docker-compose-remote.yml ====="
          cat -n docker-compose-remote.yml

      - name: Validate compose
        run: |
          docker compose -f docker-compose-remote.yml config

      - name: Start PostGIS
        run: |
          docker compose -f docker-compose-remote.yml \
            -p remote-db-${{ github.ref_name }} \
            up -d --build

      - name: Show running containers
        run: |
          docker ps
          docker volume ls | grep remote-db || true